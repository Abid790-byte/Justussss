          data class Room(val id: String, val title: String, val isGroup: Boolean)
          data class Msg(val id: Long, val senderId: String, val sender: String, val body: String?, val image: String?, val at: String)

          class Session(ctx: Context) {
              private val p = ctx.getSharedPreferences("session", Context.MODE_PRIVATE)
              var access: String
                  get() = p.getString("a", "") ?: ""
                  set(v) { p.edit().putString("a", v).apply() }
              var refresh: String
                  get() = p.getString("r", "") ?: ""
                  set(v) { p.edit().putString("r", v).apply() }
              var uid: String
                  get() = p.getString("u", "") ?: ""
                  set(v) { p.edit().putString("u", v).apply() }
              var name: String
                  get() = p.getString("n", "") ?: ""
                  set(v) { p.edit().putString("n", v).apply() }
              val loggedIn: Boolean get() = access.isNotEmpty()
              fun clear() { p.edit().clear().apply() }
          }

          class Api(private val s: Session) {
              private fun call(method: String, path: String, body: String?, token: String?,
                               type: String = "application/json", raw: ByteArray? = null): Pair<Int, String> {
                  val c = URL(Cfg.BASE + path).openConnection() as HttpURLConnection
                  c.requestMethod = method
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.setRequestProperty("apikey", Cfg.KEY)
                  if (token != null) c.setRequestProperty("Authorization", "Bearer $token")
                  c.setRequestProperty("Content-Type", type)
                  val bytes = raw ?: body?.toByteArray()
                  if (bytes != null) {
                      c.doOutput = true
                      c.outputStream.use { it.write(bytes) }
                  }
                  val code = c.responseCode
                  val stream = if (code < 400) c.inputStream else c.errorStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  c.disconnect()
                  return Pair(code, text)
              }

              private fun errMsg(text: String): String {
                  return try {
                      val j = JSONObject(text)
                      listOf("message", "msg", "error_description", "error")
                          .map { j.optString(it, "") }.firstOrNull { it.isNotEmpty() } ?: text
                  } catch (e: Exception) {
                      if (text.isEmpty()) "Network error" else text
                  }
              }

              private fun saveSession(j: JSONObject) {
                  s.access = j.getString("access_token")
                  s.refresh = j.getString("refresh_token")
                  val u = j.getJSONObject("user")
                  s.uid = u.getString("id")
                  val n = u.optJSONObject("user_metadata")?.optString("username", "") ?: ""
                  if (n.isNotEmpty()) s.name = n
              }

              private fun refreshSession() {
                  val r = call("POST", "/auth/v1/token?grant_type=refresh_token",
                      JSONObject().put("refresh_token", s.refresh).toString(), null)
                  if (r.first >= 400) {
                      s.clear()
                      throw ApiException("Session expired, please log in again")
                  }
                  saveSession(JSONObject(r.second))
              }

              private fun authed(method: String, path: String, body: String? = null,
                                 type: String = "application/json", raw: ByteArray? = null): String {
                  var r = call(method, path, body, s.access, type, raw)
                  if (r.first == 401) {
                      refreshSession()
                      r = call(method, path, body, s.access, type, raw)
                  }
                  if (r.first >= 400) throw ApiException(errMsg(r.second))
                  return r.second
              }

              fun signUp(email: String, password: String, username: String) {
                  val body = JSONObject().put("email", email.trim()).put("password", password)
                      .put("data", JSONObject().put("username", username.trim())).toString()
                  val r = call("POST", "/auth/v1/signup", body, null)
                  if (r.first >= 400) throw ApiException(errMsg(r.second))
                  val j = JSONObject(r.second)
                  if (!j.has("access_token")) {
                      throw ApiException("Account created, but email confirmation is ON in Supabase. Turn it off (Authentication > Sign In / Providers > Email), then log in.")
                  }
                  saveSession(j)
              }

              fun signIn(email: String, password: String) {
                  val body = JSONObject().put("email", email.trim()).put("password", password).toString()
                  val r = call("POST", "/auth/v1/token?grant_type=password", body, null)
                  if (r.first >= 400) throw ApiException(errMsg(r.second))
                  saveSession(JSONObject(r.second))
              }

              fun rooms(): List<Room> {
                  val arr = JSONArray(authed("POST", "/rest/v1/rpc/my_rooms", "{}"))
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Room(o.getString("id"), if (o.isNull("title")) "Chat" else o.getString("title"), o.getBoolean("is_group"))
                  }
              }

              fun messages(roomId: String): List<Msg> {
                  val q = "/rest/v1/messages?room_id=eq.$roomId&order=created_at.desc&limit=200" +
                      "&select=id,sender_id,sender_name,body,image_url,created_at"
                  val arr = JSONArray(authed("GET", q))
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      Msg(
                          o.getLong("id"), o.getString("sender_id"), o.getString("sender_name"),
                          if (o.isNull("body")) null else o.getString("body"),
                          if (o.isNull("image_url")) null else o.getString("image_url"),
                          o.getString("created_at")
                      )
                  }.reversed()
              }

              fun send(roomId: String, name: String, body: String?, image: String?) {
                  val j = JSONObject().put("room_id", roomId).put("sender_name", name)
                  if (body != null) j.put("body", body)
                  if (image != null) j.put("image_url", image)
                  authed("POST", "/rest/v1/messages", j.toString())
              }

              fun startDm(username: String): String {
                  val t = authed("POST", "/rest/v1/rpc/start_dm", JSONObject().put("other", username.trim()).toString())
                  return t.trim().trim('"')
              }

              fun createGroup(name: String, members: List<String>) {
                  val j = JSONObject().put("gname", name.trim()).put("members", JSONArray(members))
                  authed("POST", "/rest/v1/rpc/create_group", j.toString())
              }

              fun uploadPhoto(bytes: ByteArray): String {
                  val path = "${s.uid}/${System.currentTimeMillis()}.jpg"
                  authed("POST", "/storage/v1/object/photos/$path", type = "image/jpeg", raw = bytes)
                  return "${Cfg.BASE}/storage/v1/object/public/photos/$path"
              }
          }

          fun compressPhoto(ctx: Context, uri: Uri): ByteArray {
              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
              ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
              var sample = 1
              while (bounds.outWidth / sample > 1280 || bounds.outHeight / sample > 1280) sample *= 2
              val opts = BitmapFactory.Options().apply { inSampleSize = sample }
              val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                  ?: throw ApiException("Could not read photo")
              val orient = try {
                  ctx.contentResolver.openInputStream(uri)?.use {
                      ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)
                  } ?: 1
              } catch (e: Exception) { 1 }
              val deg = when (orient) { 6 -> 90f; 3 -> 180f; 8 -> 270f; else -> 0f }
              val fin = if (deg != 0f) {
                  Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, Matrix().apply { postRotate(deg) }, true)
              } else bmp
              val out = ByteArrayOutputStream()
              fin.compress(Bitmap.CompressFormat.JPEG, 80, out)
              return out.toByteArray()
          }


