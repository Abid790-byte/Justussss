                  Modifier.fillMaxSize().padding(28.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text("\uD83D\uDCAC", fontSize = 64.sp,
                      modifier = Modifier.graphicsLayer {
                          scaleX = logoScale.value; scaleY = logoScale.value; translationY = bob
                      })
                  Spacer(Modifier.height(8.dp))
                  Text("FriendChat", style = TextStyle(
                      brush = Brush.horizontalGradient(listOf(Accent, Pink)),
                      fontSize = 36.sp, fontWeight = FontWeight.ExtraBold))
                  Text("Just you and your people", color = Soft)
                  Spacer(Modifier.height(28.dp))
                  OutlinedTextField(email, { email = it }, label = { Text("Email") }, singleLine = true,
                      shape = RoundedCornerShape(16.dp), colors = fieldColors(), modifier = Modifier.fillMaxWidth())
                  AnimatedVisibility(signUp, enter = fadeIn() + expandVertically(), exit = fadeOut() + shrinkVertically()) {
                      Column {
                          Spacer(Modifier.height(10.dp))
                          OutlinedTextField(username, { username = it }, label = { Text("Username (friends find you by this)") },
                              singleLine = true, shape = RoundedCornerShape(16.dp), colors = fieldColors(),
                              modifier = Modifier.fillMaxWidth())
