          @Composable
          fun AppBackground(content: @Composable () -> Unit) {
              val inf = rememberInfiniteTransition(label = "bg")
              val t by inf.animateFloat(0f, 1f, infiniteRepeatable(tween(9000, easing = LinearEasing), RepeatMode.Reverse), label = "bgt")
              Box(Modifier.fillMaxSize().drawBehind {
                  drawRect(Brush.verticalGradient(listOf(Bg1, lerp(Bg2, Bg3, t), Bg3)))
              }) { content() }
          }

          @Composable
          fun Pop(animate: Boolean, delayMs: Long = 0L, slideX: Float = 0f, slideY: Float = 0f,
                  originX: Float = 0.5f, startScale: Float = 1f, content: @Composable () -> Unit) {
              val p = remember { Animatable(if (animate) 0f else 1f) }
              LaunchedEffect(Unit) {
                  if (animate) {
                      delay(delayMs)
                      p.animateTo(1f, tween(320, easing = FastOutSlowInEasing))
                  }
              }
              Box(Modifier.graphicsLayer {
                  val v = p.value
                  alpha = v
                  translationX = (1f - v) * slideX
                  translationY = (1f - v) * slideY
                  val sc = startScale + (1f - startScale) * v
                  scaleX = sc
                  scaleY = sc
                  transformOrigin = TransformOrigin(originX, 1f)
              }) { content() }
          }

          @Composable
          fun ReactionRow(rx: List<Reaction>, myId: String, onTap: (String) -> Unit) {
              val groups = rx.groupBy { it.emoji }
              Row(Modifier.padding(top = 2.dp), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                  groups.forEach { (e, list) ->
                      val mine = list.any { it.userId == myId }
                      Row(
                          Modifier.clip(RoundedCornerShape(50))
                              .background(if (mine) Color(0x558E7CFF) else Glass)
                              .border(1.dp, if (mine) Accent else GlassEdge, RoundedCornerShape(50))
                              .clickable { onTap(e) }
                              .padding(horizontal = 8.dp, vertical = 2.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text(e, fontSize = 13.sp)
                          if (list.size > 1) {
                              Spacer(Modifier.width(3.dp))
                              Text("${list.size}", fontSize = 12.sp, color = Soft)
                          }
                      }
                  }
              }
          }

          // ---------- App ----------
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val session = Session(this)
                  setContent { App(session) }
              }
              override fun onStart() {
                  super.onStart()
                  AppState.fg = true
              }
              override fun onStop() {
                  AppState.fg = false
                  super.onStop()
              }
          }

          @Composable
          fun App(session: Session) {
              val api = remember { Api(session) }
              var loggedIn by remember { mutableStateOf(session.loggedIn) }
              var room by remember { mutableStateOf<Room?>(null) }

              LaunchedEffect(loggedIn, AppState.fg) {
                  if (loggedIn && AppState.fg) {
                      while (true) {
                          try { withContext(Dispatchers.IO) { api.touch() } } catch (e: Exception) { }
                          delay(30000)
                      }
                  }
              }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Accent, onPrimary = Color.White, background = Bg1, surface = Bg1,
                      onSurface = Color.White, onBackground = Color.White,
                      surfaceVariant = Glass, onSurfaceVariant = Soft
                  )
              ) {
                  AppBackground {
                      Surface(Modifier.fillMaxSize(), color = Color.Transparent, contentColor = Color.White) {
                          AnimatedContent(
                              targetState = Pair(loggedIn, room),
                              modifier = Modifier.fillMaxSize(),
                              transitionSpec = {
                                  if (targetState.first != initialState.first) {
                                      fadeIn(tween(400)) togetherWith fadeOut(tween(250))
                                  } else if (targetState.second != null) {
                                      (slideInHorizontally(tween(350)) { it } + fadeIn(tween(350))) togetherWith
                                          (slideOutHorizontally(tween(350)) { -it / 3 } + fadeOut(tween(250)))
                                  } else {
                                      (slideInHorizontally(tween(350)) { -it / 3 } + fadeIn(tween(350))) togetherWith
                                          (slideOutHorizontally(tween(350)) { it } + fadeOut(tween(250)))
                                  }
                              },
                              label = "nav"
                          ) { state ->
                              val r = state.second
                              when {
                                  !state.first -> AuthScreen(api) { loggedIn = true }
                                  r == null -> RoomsScreen(api, session, { room = it }) {
                                      session.clear(); room = null; loggedIn = false
                                  }
                                  else -> ChatScreen(api, session, r) { room = null }
                              }
                          }
                      }
                  }
              }
          }

