          @Composable
          fun RoomsScreen(api: Api, session: Session, onOpen: (Room) -> Unit, onLogout: () -> Unit) {
              var rooms by remember { mutableStateOf<List<Room>>(emptyList()) }
              var error by remember { mutableStateOf("") }
              var showNew by remember { mutableStateOf(false) }
              var showProfile by remember { mutableStateOf(false) }
              var myAvatar by remember { mutableStateOf<String?>(null) }
              var photoBusy by remember { mutableStateOf(false) }
              var photoErr by remember { mutableStateOf("") }
              var tick by remember { mutableStateOf(0) }
              val scope = rememberCoroutineScope()
              val ctx = androidx.compose.ui.platform.LocalContext.current

              val avatarPicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) scope.launch {
                      photoBusy = true
                      photoErr = ""
                      try {
                          val url = withContext(Dispatchers.IO) {
                              val u = api.uploadPhoto(compressPhoto(ctx, uri, 512))
                              api.setAvatar(u)
                              u
                          }
                          myAvatar = url
                      } catch (e: Exception) { photoErr = e.message ?: "Upload failed" }
                      photoBusy = false
                  }
              }

              LaunchedEffect(tick) {
                  while (true) {
                      if (AppState.fg) {
                          try {
                              val r = withContext(Dispatchers.IO) { api.rooms() }
                              if (r != rooms) rooms = r
                              val p = withContext(Dispatchers.IO) { api.profiles() }
                              myAvatar = p[session.uid]?.avatar
                              error = ""
                          } catch (e: Exception) { error = e.message ?: "Network error" }
                      }
                      delay(4000)
                  }
              }

              Column(Modifier.fillMaxSize().padding(horizontal = 18.dp, vertical = 14.dp)) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Box(Modifier.clip(CircleShape).clickable { showProfile = true }) {
                          Avatar(session.name, 50.dp, url = myAvatar)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text("Chats", style = TextStyle(
                              brush = Brush.horizontalGradient(listOf(Accent, Pink)),
                              fontSize = 30.sp, fontWeight = FontWeight.ExtraBold))
                          Text("Hi, ${session.name}", color = Soft)
                      }
                      GradientButton("+ New") { showNew = true }
                  }
                  AnimatedVisibility(error.isNotEmpty()) { Text(error, color = Danger) }
                  if (rooms.isEmpty() && error.isEmpty()) Text("Loading...", color = Soft, modifier = Modifier.padding(top = 12.dp))
                  Spacer(Modifier.height(10.dp))
                  LazyColumn {
                      itemsIndexed(rooms, key = { _, r -> r.id }) { index, r ->
                          Pop(true, minOf(index, 8) * 60L, slideX = 100f) {
                              GlassCard(Modifier.fillMaxWidth().padding(vertical = 5.dp), onClick = { onOpen(r) }) {
                                  Avatar(r.title, 52.dp, if (r.isGroup) "\uD83D\uDC65" else null, r.otherAvatar,
                                      online = !r.isGroup && isOnline(r.otherSeen))
                                  Spacer(Modifier.width(14.dp))
                                  val who = if (r.lastSender == session.name) "You: "
                                            else if (r.isGroup && r.lastSender != null) r.lastSender + ": " else ""
                                  val sub = if (r.lastAt == null) "No messages yet"
                                            else if (r.lastDeleted) "\uD83D\uDEAB Message deleted"
                                            else if (r.lastImage && r.lastBody.isNullOrEmpty()) who + "\uD83D\uDCF7 Photo"
                                            else who + (r.lastBody ?: "")
                                  Column(Modifier.weight(1f)) {
                                      Text(r.title, fontSize = 17.sp, fontWeight = FontWeight.SemiBold, maxLines = 1,
                                          overflow = TextOverflow.Ellipsis)
                                      Text(sub, color = if (r.unread > 0) Color.White else Soft, fontSize = 13.sp,
                                          fontWeight = if (r.unread > 0) FontWeight.SemiBold else FontWeight.Normal,
                                          maxLines = 1, overflow = TextOverflow.Ellipsis)
                                  }
                                  Spacer(Modifier.width(8.dp))
                                  Column(horizontalAlignment = Alignment.End) {
                                      Text(shortTime(r.lastAt), fontSize = 11.sp, color = if (r.unread > 0) Accent else Soft)
                                      if (r.unread > 0) {
                                          Spacer(Modifier.height(4.dp))
                                          Box(
                                              Modifier.clip(CircleShape)
                                                  .background(Brush.linearGradient(listOf(Accent, Pink)))
                                                  .defaultMinSize(minWidth = 22.dp, minHeight = 22.dp)
                                                  .padding(horizontal = 6.dp),
                                              contentAlignment = Alignment.Center
                                          ) {
                                              Text(if (r.unread > 99) "99+" else "${r.unread}", fontSize = 12.sp,
                                                  color = Color.White, fontWeight = FontWeight.Bold)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (showProfile) {
                  AlertDialog(
                      onDismissRequest = { showProfile = false },
                      containerColor = Color(0xFF1E1B3A),
                      shape = RoundedCornerShape(24.dp),
                      title = { Text("Your profile") },
                      text = {
                          Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
                              Avatar(session.name, 110.dp, url = myAvatar)
                              Spacer(Modifier.height(10.dp))
                              Text(session.name, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(14.dp))
                              GradientButton(if (photoBusy) "Uploading..." else "Change photo", enabled = !photoBusy) {
                                  avatarPicker.launch("image/*")
                              }
                              if (photoErr.isNotEmpty()) Text(photoErr, color = Danger)
                              TextButton({ showProfile = false; onLogout() }) { Text("Log out", color = Danger) }
                          }
                      },
                      confirmButton = { TextButton({ showProfile = false }) { Text("Done", color = Accent) } }
                  )
              }

              if (showNew) {
                  var group by remember { mutableStateOf(false) }
                  var name by remember { mutableStateOf("") }
                  var users by remember { mutableStateOf("") }
                  var err by remember { mutableStateOf("") }
                  var busy by remember { mutableStateOf(false) }
                  AlertDialog(
                      onDismissRequest = { showNew = false },
                      containerColor = Color(0xFF1E1B3A),
                      shape = RoundedCornerShape(24.dp),
                      title = { Text(if (group) "New group" else "New 1-to-1 chat") },
                      text = {
                          Column {
                              Row {
                                  FilterChip(!group, { group = false }, label = { Text("1-to-1") })
                                  Spacer(Modifier.width(8.dp))
                                  FilterChip(group, { group = true }, label = { Text("Group") })
                              }
                              Spacer(Modifier.height(10.dp))
                              if (group) {
                                  OutlinedTextField(name, { name = it }, label = { Text("Group name") }, singleLine = true,
                                      shape = RoundedCornerShape(14.dp), colors = fieldColors())
                                  Spacer(Modifier.height(8.dp))
                                  OutlinedTextField(users, { users = it }, label = { Text("Usernames, comma separated") },
                                      shape = RoundedCornerShape(14.dp), colors = fieldColors())
                              } else {
                                  OutlinedTextField(users, { users = it }, label = { Text("Friend's username") }, singleLine = true,
                                      shape = RoundedCornerShape(14.dp), colors = fieldColors())
                              }
                              if (err.isNotEmpty()) Text(err, color = Danger)
                          }
                      },
                      confirmButton = {
                          TextButton(enabled = !busy, onClick = {
                              scope.launch {
                                  busy = true
                                  err = ""
                                  try {
                                      withContext(Dispatchers.IO) {
                                          if (group) {
                                              api.createGroup(name, users.split(",").map { it.trim() }.filter { it.isNotEmpty() })
                                          } else api.startDm(users)
                                      }
                                      showNew = false
                                      tick++
                                  } catch (e: Exception) { err = e.message ?: "Failed" }
                                  busy = false
                              }
                          }) { Text("Create", color = Accent) }
                      },
                      dismissButton = { TextButton({ showNew = false }) { Text("Cancel", color = Soft) } }
                  )
              }
          }

          @Composable
          fun ChatScreen(api: Api, session: Session, room: Room, onBack: () -> Unit) {
              var msgs by remember { mutableStateOf<List<Msg>>(emptyList()) }
              var reactions by remember { mutableStateOf<List<Reaction>>(emptyList()) }
              var profiles by remember { mutableStateOf<Map<String, Profile>>(emptyMap()) }
              var text by remember { mutableStateOf("") }
              var error by remember { mutableStateOf("") }
              var sending by remember { mutableStateOf(false) }
              var viewer by remember { mutableStateOf<String?>(null) }
              var menuMsg by remember { mutableStateOf<Msg?>(null) }
              var replyTo by remember { mutableStateOf<Msg?>(null) }
              var loaded by remember(room.id) { mutableStateOf(false) }
              var lastRead by remember(room.id) { mutableStateOf<Long?>(null) }
              val seen = remember(room.id) { mutableSetOf<Long>() }
              val scope = rememberCoroutineScope()
              val listState = rememberLazyListState()
              val ctx = androidx.compose.ui.platform.LocalContext.current
              BackHandler { if (viewer != null) viewer = null else onBack() }

              suspend fun refresh() {
                  val pair = withContext(Dispatchers.IO) { Pair(api.messages(room.id), api.reactions(room.id)) }
                  val m = pair.first
                  val rx = pair.second
                  if (!loaded) { seen.addAll(m.map { it.id }); loaded = true }
                  if (m != msgs) msgs = m
                  if (rx != reactions) reactions = rx
                  val last = m.lastOrNull()?.id
                  if (last != null && last != lastRead) {
                      lastRead = last
                      withContext(Dispatchers.IO) { try { api.markRead(room.id) } catch (e: Exception) { } }
                  }
              }

              fun react(m: Msg, e: String) {
                  scope.launch {
                      try {
                          withContext(Dispatchers.IO) { api.react(m.id, e) }
                          refresh()
                      } catch (ex: Exception) { error = ex.message ?: "Failed" }
                  }
              }

              LaunchedEffect(room.id) {
                  while (true) {
                      if (AppState.fg) {
                          try { refresh(); error = "" } catch (e: Exception) { error = e.message ?: "Network error" }
                      }
                      delay(2000)
                  }
              }
              LaunchedEffect(room.id) {
                  while (true) {
                      if (AppState.fg) {
                          try {
                              val p = withContext(Dispatchers.IO) { api.profiles() }
                              if (p != profiles) profiles = p
                          } catch (e: Exception) { }
                      }
                      delay(8000)
                  }
              }
              var firstScroll by remember { mutableStateOf(true) }
              LaunchedEffect(msgs.size) {
                  if (msgs.isNotEmpty()) {
                      if (firstScroll) { listState.scrollToItem(msgs.lastIndex); firstScroll = false }
                      else listState.animateScrollToItem(msgs.lastIndex)
                  }
              }

              val picker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  if (uri != null) scope.launch {
                      sending = true
                      val rt = replyTo?.id
                      try {
                          withContext(Dispatchers.IO) {
                              val url = api.uploadPhoto(compressPhoto(ctx, uri))
                              api.send(room.id, session.name, null, url, rt)
                          }
                          replyTo = null
                          refresh()
                      } catch (e: Exception) { error = e.message ?: "Photo failed" }
                      sending = false
                  }
              }

              val other = room.otherId?.let { profiles[it] }
              val otherOnline = !room.isGroup && isOnline(other?.seen)

              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 10.dp, vertical = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          Modifier.size(40.dp).clip(CircleShape).background(Glass).clickable { onBack() },
                          contentAlignment = Alignment.Center
                      ) { Text("\u2039", fontSize = 26.sp) }
                      Spacer(Modifier.width(10.dp))
                      Avatar(room.title, 44.dp, if (room.isGroup) "\uD83D\uDC65" else null,
                          other?.avatar ?: room.otherAvatar, online = otherOnline)
                      Spacer(Modifier.width(10.dp))
                      Column {
                          Text(room.title, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          val sub = if (room.isGroup) "Group chat"
                                    else if (profiles.isEmpty()) ""
                                    else lastSeenText(other?.seen)
                          Text(sub, color = if (otherOnline) Green else Soft, fontSize = 12.sp)
                      }
                  }
                  AnimatedVisibility(error.isNotEmpty()) {
                      Text(error, color = Danger, modifier = Modifier.padding(horizontal = 14.dp))
                  }

                  Box(Modifier.weight(1f).fillMaxWidth()) {
                      if (loaded && msgs.isEmpty()) {
                          Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("\uD83D\uDC4B", fontSize = 44.sp)
                              Text("Say hi!", color = Soft)
                          }
                      }
                      LazyColumn(Modifier.fillMaxSize().padding(horizontal = 10.dp), state = listState) {
                          items(msgs, key = { it.id }) { m ->
                              val mine = m.senderId == session.uid
                              val animate = remember { m.id !in seen }
                              LaunchedEffect(Unit) { seen.add(m.id) }
                              val rx = reactions.filter { it.messageId == m.id }
                              Pop(animate, 0L, slideY = 60f, originX = if (mine) 1f else 0f, startScale = 0.85f) {
                                  Row(
                                      Modifier.fillMaxWidth().padding(vertical = 3.dp),
                                      horizontalArrangement = if (mine) Arrangement.End else Arrangement.Start,
                                      verticalAlignment = Alignment.Bottom
                                  ) {
                                      if (!mine) {
                                          Avatar(m.sender, 30.dp, url = profiles[m.senderId]?.avatar)
                                          Spacer(Modifier.width(6.dp))
                                      }
                                      Column(horizontalAlignment = if (mine) Alignment.End else Alignment.Start) {
                                          val shape = if (mine) RoundedCornerShape(18.dp, 18.dp, 4.dp, 18.dp)
                                                      else RoundedCornerShape(18.dp, 18.dp, 18.dp, 4.dp)
                                          Column(
                                              Modifier.widthIn(max = 270.dp).clip(shape)
                                                  .background(if (mine) Brush.linearGradient(listOf(Color(0xFF7F5BFF), Color(0xFFD65BFF)))
                                                              else Brush.linearGradient(listOf(Color(0x26FFFFFF), Color(0x26FFFFFF))))
                                                  .pointerInput(m) {
                                                      detectTapGestures(
                                                          onTap = { if (m.image != null) viewer = m.image },
                                                          onDoubleTap = { if (!m.deleted) react(m, HEART) },
                                                          onLongPress = { if (!m.deleted) menuMsg = m }
                                                      )
                                                  }
                                                  .padding(horizontal = 12.dp, vertical = 8.dp)
                                          ) {
                                              if (!mine) Text(m.sender, fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Accent)
                                              if (m.deleted) {
                                                  Text("\uD83D\uDEAB This message was deleted", fontStyle = FontStyle.Italic, color = Soft)
                                              } else {
                                                  if (m.replyTo != null) {
                                                      val orig = msgs.firstOrNull { it.id == m.replyTo }
                                                      Column(
                                                          Modifier.padding(bottom = 4.dp).clip(RoundedCornerShape(8.dp))
                                                              .background(Color(0x33000000)).padding(6.dp)
                                                      ) {
                                                          Text(orig?.sender ?: "Message", fontSize = 11.sp,
                                                              fontWeight = FontWeight.Bold, color = Color(0xFFE6E0FF))
                                                          Text(previewOf(orig), fontSize = 12.sp, color = Color(0xCCFFFFFF),
                                                              maxLines = 1, overflow = TextOverflow.Ellipsis)
                                                      }
                                                  }
                                                  if (m.image != null) {
                                                      RemoteImage(m.image, Modifier.size(220.dp).clip(RoundedCornerShape(12.dp)))
                                                      Spacer(Modifier.height(4.dp))
                                                  }
                                                  if (!m.body.isNullOrEmpty()) Text(m.body, fontSize = 16.sp)
                                              }
                                              Text(hhmm(m.at), fontSize = 10.sp, color = Color(0xB3FFFFFF),
                                                  modifier = Modifier.align(Alignment.End))
                                          }
                                          if (rx.isNotEmpty() && !m.deleted) ReactionRow(rx, session.uid) { e -> react(m, e) }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  AnimatedVisibility(sending) {
                      Text("Uploading photo...", color = Soft, fontSize = 12.sp, modifier = Modifier.padding(start = 20.dp))
                  }
                  AnimatedVisibility(replyTo != null) {
                      val r = replyTo
                      Row(
                          Modifier.fillMaxWidth().padding(horizontal = 14.dp).clip(RoundedCornerShape(14.dp))
                              .background(Glass).padding(start = 12.dp, top = 6.dp, bottom = 6.dp, end = 4.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(Modifier.weight(1f)) {
                              Text("Replying to " + (r?.sender ?: ""), fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Accent)
                              Text(previewOf(r), fontSize = 12.sp, color = Soft, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                          Text("\u2715", fontSize = 16.sp, color = Soft,
                              modifier = Modifier.clip(CircleShape).clickable { replyTo = null }.padding(10.dp))
                      }
                  }
                  Row(
                      Modifier.fillMaxWidth().padding(10.dp).clip(RoundedCornerShape(30.dp)).background(Glass)
                          .border(1.dp, GlassEdge, RoundedCornerShape(30.dp))
                          .padding(start = 6.dp, end = 6.dp, top = 4.dp, bottom = 4.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          Modifier.size(42.dp).clip(CircleShape).clickable(enabled = !sending) { picker.launch("image/*") },
                          contentAlignment = Alignment.Center
                      ) { Text("\uD83D\uDCF7", fontSize = 20.sp) }
                      TextField(
                          value = text, onValueChange = { text = it }, modifier = Modifier.weight(1f),
                          placeholder = { Text("Message") }, maxLines = 4,
                          colors = TextFieldDefaults.colors(
                              focusedContainerColor = Color.Transparent, unfocusedContainerColor = Color.Transparent,
                              focusedIndicatorColor = Color.Transparent, unfocusedIndicatorColor = Color.Transparent,
                              cursorColor = Accent
                          )
                      )
                      GradientButton("Send", enabled = text.isNotBlank()) {
                          val t = text.trim()
                          if (t.isNotEmpty()) {
                              val rt = replyTo?.id
                              text = ""
                              replyTo = null
                              scope.launch {
                                  try {
                                      withContext(Dispatchers.IO) { api.send(room.id, session.name, t, null, rt) }
                                      refresh()
                                  } catch (e: Exception) { error = e.message ?: "Send failed"; text = t }
                              }
                          }
                      }
                  }
              }

              val mm = menuMsg
              if (mm != null) {
                  AlertDialog(
                      onDismissRequest = { menuMsg = null },
                      containerColor = Color(0xFF1E1B3A),
                      shape = RoundedCornerShape(24.dp),
                      confirmButton = {},
                      text = {
                          Column {
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                                  EMOJIS.forEach { e ->
                                      Text(e, fontSize = 24.sp,
                                          modifier = Modifier.clip(CircleShape)
                                              .clickable { menuMsg = null; react(mm, e) }.padding(5.dp))
                                  }
                              }
                              Spacer(Modifier.height(10.dp))
                              TextButton({ replyTo = mm; menuMsg = null }) { Text("Reply", color = Accent) }
                              if (mm.senderId == session.uid) {
                                  TextButton({
                                      menuMsg = null
                                      scope.launch {
                                          try {
                                              withContext(Dispatchers.IO) { api.deleteMessage(mm.id) }
                                              refresh()
                                          } catch (e: Exception) { error = e.message ?: "Delete failed" }
                                      }
                                  }) { Text("Delete", color = Danger) }
                              }
                          }
                      }
                  )
              }

              val v = viewer
              if (v != null) {
                  Dialog(onDismissRequest = { viewer = null }, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                      Box(Modifier.fillMaxSize().background(Color(0xE6000000)).clickable { viewer = null },
                          contentAlignment = Alignment.Center) {
                          RemoteImage(v, Modifier.fillMaxSize(), ContentScale.Fit)
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chat-${{ github.run_number }}
          name: FriendChat build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
