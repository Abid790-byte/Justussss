              fun uploadPhoto(bytes: ByteArray): String {
                  val path = "${s.uid}/${System.currentTimeMillis()}.jpg"
                  authed("POST", "/storage/v1/object/photos/$path", type = "image/jpeg", raw = bytes)
                  return "${Cfg.BASE}/storage/v1/object/public/photos/$path"
              }
          }

          fun compressPhoto(ctx: Context, uri: Uri, max: Int = 1280): ByteArray {
              val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
              ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
              var sample = 1
              while (bounds.outWidth / sample > max || bounds.outHeight / sample > max) sample *= 2
              val opts = BitmapFactory.Options().apply { inSampleSize = sample }
              val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                  ?: throw ApiException("Could not read photo")
              val orient = try {
                  ctx.contentResolver.openInputStream(uri)?.use {
                      ExifInterface(it).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)
                  } ?: 1
              } catch (e: Exception) { 1 }
              val deg = when (orient) { 6 -> 90f; 3 -> 180f; 8 -> 270f; else -> 0f }
              val fin = if (deg != 0f) {
                  Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, Matrix().apply { postRotate(deg) }, true)
              } else bmp
              val out = ByteArrayOutputStream()
              fin.compress(Bitmap.CompressFormat.JPEG, 80, out)
              return out.toByteArray()
          }

          // ---------- time helpers ----------
          fun hhmm(iso: String): String = try {
              OffsetDateTime.parse(iso).atZoneSameInstant(ZoneId.systemDefault())
                  .format(DateTimeFormatter.ofPattern("HH:mm"))
          } catch (e: Exception) { "" }

          fun shortTime(iso: String?): String = try {
              if (iso == null) "" else {
                  val z = OffsetDateTime.parse(iso).atZoneSameInstant(ZoneId.systemDefault())
                  if (z.toLocalDate() == java.time.LocalDate.now()) z.format(DateTimeFormatter.ofPattern("HH:mm"))
                  else z.format(DateTimeFormatter.ofPattern("d MMM"))
              }
          } catch (e: Exception) { "" }

          fun isOnline(seen: String?): Boolean = try {
              seen != null && java.time.Duration.between(OffsetDateTime.parse(seen), OffsetDateTime.now()).seconds < 75
          } catch (e: Exception) { false }

          fun lastSeenText(seen: String?): String {
              if (seen == null) return "offline"
              if (isOnline(seen)) return "online"
              return "last seen " + shortTime(seen).let { t ->
                  try {
                      val z = OffsetDateTime.parse(seen).atZoneSameInstant(ZoneId.systemDefault())
                      if (z.toLocalDate() == java.time.LocalDate.now()) hhmm(seen) else t + ", " + hhmm(seen)
                  } catch (e: Exception) { t }
              }
          }

