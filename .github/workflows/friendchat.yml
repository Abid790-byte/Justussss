          private val imgCache = HashMap<String, Bitmap>()

          @Composable
          fun RemoteImage(url: String, modifier: Modifier, scale: ContentScale = ContentScale.Crop) {
              val bmp by produceState<Bitmap?>(imgCache[url], url) {
                  if (value == null) {
                      value = withContext(Dispatchers.IO) {
                          try {
                              val b = URL(url).openStream().use { BitmapFactory.decodeStream(it) }
                              if (b != null) {
                                  if (imgCache.size > 60) imgCache.clear()
                                  imgCache[url] = b
                              }
                              b
                          } catch (e: Exception) { null }
                      }
                  }
              }
              val b = bmp
              val fade by animateFloatAsState(if (b != null) 1f else 0f, tween(450), label = "imgfade")
              val inf = rememberInfiniteTransition(label = "shimmer")
              val pulse by inf.animateFloat(0.25f, 0.6f,
                  infiniteRepeatable(tween(900), RepeatMode.Reverse), label = "pulse")
              Box(modifier) {
                  if (b == null) Box(Modifier.matchParentSize().background(Color.White.copy(alpha = pulse * 0.4f)))
                  if (b != null) Image(b.asImageBitmap(), null, Modifier.matchParentSize().graphicsLayer { alpha = fade },
                      contentScale = scale)
              }
          }

          @Composable
          fun Avatar(name: String, size: Dp, emoji: String? = null, url: String? = null, online: Boolean = false) {
              val pairs = listOf(
                  Pair(Color(0xFF8E7CFF), Color(0xFF5B8DEF)),
                  Pair(Color(0xFFFF6FD8), Color(0xFFFF9A8B)),
                  Pair(Color(0xFF43E97B), Color(0xFF38C9D7)),
                  Pair(Color(0xFFFFB75E), Color(0xFFED6F3F)),
                  Pair(Color(0xFF4FACFE), Color(0xFF00C2EE))
              )
              val p = pairs[(name.lowercase().hashCode() and 0x7fffffff) % pairs.size]
              Box(Modifier.size(size)) {
                  Box(
                      Modifier.fillMaxSize().clip(CircleShape).background(Brush.linearGradient(listOf(p.first, p.second))),
                      contentAlignment = Alignment.Center
                  ) {
                      if (!url.isNullOrEmpty()) {
                          RemoteImage(url, Modifier.fillMaxSize())
                      } else {
                          val label = emoji ?: name.trim().take(1).uppercase().ifEmpty { "?" }
                          Text(label, color = Color.White, fontWeight = FontWeight.Bold, fontSize = (size.value * 0.42f).sp)
