                      .background(Glass)
                      .border(1.dp, GlassEdge, RoundedCornerShape(20.dp))
                      .clickable(interactionSource = src, indication = null, onClick = onClick)
                      .padding(14.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  content = content
              )
          }

