          } catch (e: Exception) { "" }

          @Composable
          fun RemoteImage(url: String, modifier: Modifier, scale: ContentScale = ContentScale.Crop) {
              val bmp by produceState<Bitmap?>(imgCache[url], url) {
                  if (value == null) {
                      value = withContext(Dispatchers.IO) {
                          try {
                              val b = URL(url).openStream().use { BitmapFactory.decodeStream(it) }
                              if (b != null) {
                                  if (imgCache.size > 30) imgCache.clear()
                                  imgCache[url] = b
                              }
                              b
                          } catch (e: Exception) { null }
                      }
                  }
              }
              val b = bmp
              val fade by animateFloatAsState(if (b != null) 1f else 0f, tween(450), label = "imgfade")
              val inf = rememberInfiniteTransition(label = "shimmer")
              val pulse by inf.animateFloat(0.25f, 0.6f,
                  infiniteRepeatable(tween(900), RepeatMode.Reverse), label = "pulse")
              Box(modifier) {
                  if (b == null) Box(Modifier.matchParentSize().background(Color.White.copy(alpha = pulse * 0.4f)))
                  if (b != null) Image(b.asImageBitmap(), null, Modifier.matchParentSize().graphicsLayer { alpha = fade },
                      contentScale = scale)
              }
          }

          @Composable
