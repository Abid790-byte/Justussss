                              .background(Color(0xFF1E1B3A)).padding(2.dp).clip(CircleShape).background(Green)
                      )
                  }
              }
          }

          @Composable
          fun GradientButton(text: String, modifier: Modifier = Modifier, enabled: Boolean = true, onClick: () -> Unit) {
              val src = remember { MutableInteractionSource() }
              val pressed by src.collectIsPressedAsState()
              val sc by animateFloatAsState(if (pressed) 0.9f else 1f, spring(dampingRatio = 0.45f, stiffness = 500f), label = "btnscale")
              val av by animateFloatAsState(if (enabled) 1f else 0.4f, label = "btnalpha")
              Box(
                  modifier
                      .graphicsLayer { scaleX = sc; scaleY = sc; alpha = av }
                      .clip(RoundedCornerShape(50))
                      .background(Brush.horizontalGradient(listOf(Accent, Pink)))
                      .clickable(interactionSource = src, indication = null, enabled = enabled, onClick = onClick)
                      .padding(horizontal = 22.dp, vertical = 12.dp),
                  contentAlignment = Alignment.Center
              ) { Text(text, color = Color.White, fontWeight = FontWeight.SemiBold) }
          }

