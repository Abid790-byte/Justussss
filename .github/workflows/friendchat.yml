              val logoScale = remember { Animatable(0.3f) }
              LaunchedEffect(Unit) { logoScale.animateTo(1f, spring(dampingRatio = 0.35f, stiffness = 120f)) }
              val inf = rememberInfiniteTransition(label = "logo")
              val bob by inf.animateFloat(0f, -12f,
